# Levanta la API junto con una base MongoDB local: docker compose up -d
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    image: sebakine/entrega-final-backend-3:1.0.0
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      MONGO_URL: mongodb://mongo:27017/adoptme
      JWT_SECRET: ${JWT_SECRET:-cambiar_esta_clave_secreta}
      JWT_EXPIRES_IN: 1h
      NODE_ENV: production

volumes:
  mongo-data:
